name: S3 grand objet

# Objet de 5 Gio (au-dessus du seuil de copie multipart de rclone, 4,6 Gio) contre SeaweedFS.
# Lent et gourmand en disque : manuel, ou quand le script / ce workflow changent. Ne publie rien.
on:
  workflow_dispatch:
  pull_request:
    paths: [test/grand-objet.sh, .github/workflows/s3-grand-objet.yml]

jobs:
  grand-objet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: df -h /
      - run: bash test/grand-objet.sh
